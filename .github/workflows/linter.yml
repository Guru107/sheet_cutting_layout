
name: Linters

on:
  pull_request:
  push:
    branches:
      - develop
      - release/v1
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linter:
    name: 'Frappe Linter'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
          cache: pip
      - uses: pre-commit/action@v3.0.1

      - name: Download Semgrep rules
        run: |
          git clone https://github.com/frappe/semgrep-rules.git frappe-semgrep-rules
          cd frappe-semgrep-rules
          git checkout --detach 3011799f0ed91be48dc70e8e2a480142e106df7e

      - name: Run Semgrep rules
        run: |
          pip install semgrep==1.168.0
          semgrep ci --config ./frappe-semgrep-rules/rules --config r/python.lang.correctness

  release-metadata:
    name: Release Metadata
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - name: Validate release metadata
        run: |
          python -m unittest scripts.tests.test_check_release_metadata -v
          python scripts/check_release_metadata.py

  deps-vulnerable-check:
    name: 'Vulnerable Dependency Check'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - uses: actions/checkout@v7

      - name: Cache pip
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/*requirements.txt', '**/pyproject.toml', '**/setup.py') }}
          restore-keys: |
            ${{ runner.os }}-pip-
            ${{ runner.os }}-

      - name: Install and run pip-audit
        run: |
          pip install pip-audit==2.10.1
          cd ${GITHUB_WORKSPACE}
          pip-audit --desc on .
