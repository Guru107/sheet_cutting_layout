name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Fetch stable branch
        run: git fetch origin release/v1 --depth=1

      - name: Verify tag commit is on release/v1
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" "origin/release/v1"

      - name: Validate version and changelog against tag
        run: |
          python -m unittest scripts.tests.test_check_release_metadata -v
          python scripts/check_release_metadata.py --tag "${GITHUB_REF_NAME}"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --generate-notes \
            --verify-tag
